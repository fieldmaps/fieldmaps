[project]
name = "fieldmaps-site"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "portolan-cli>=0.9.0",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "topo-tools>=0.25.0",
    "tylertoo>=0.8.0",
]

[dependency-groups]
dev = ["ruff>=0.17.2"]

[tool.uv]
package = false
override-dependencies = ["duckdb>=2.0.0"]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "INP001", "S603", "S607", "S608"]
